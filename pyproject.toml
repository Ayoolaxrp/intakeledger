[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intakeledger"
version = "0.2.0"
description = "Transactional JSONL intake, quarantine, and lineage-preserving replay"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"

[project.scripts]
intakeledger = "intakeledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
intakeledger = ["*.sql", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["intakeledger"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
