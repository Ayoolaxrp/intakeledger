name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Isolate environment
        run: |
          python -m venv .venv
          python -c "import os,pathlib; p=pathlib.Path('.venv') / ('Scripts' if os.name == 'nt' else 'bin'); f=open(os.environ['GITHUB_PATH'],'a',encoding='utf-8'); f.write(str(p.resolve())+'\n'); f.close()"
      - name: Install
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Lock consistency
        run: python scripts/check_lock.py
      - name: Dependency consistency
        run: python -m pip check
      - name: Format
        run: python -m ruff format --check src tests scripts
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Types
        run: python -m mypy src
      - name: Tests
        run: python -m coverage run -m pytest -q
      - name: Coverage
        run: python -m coverage report --fail-under=90
      - name: Coverage XML
        run: python -m coverage xml
      - name: Repository hygiene
        run: python scripts/check_repository.py
      - name: Build
        run: python -m build --no-isolation
      - name: Package
        run: python scripts/package_smoke.py
      - name: Demo
        run: python scripts/pipeline_demo.py
      - name: Quality gate demo
        run: python scripts/quality_gate_demo.py
      - name: Inventory
        run: python scripts/dependencies.py
      - name: Workflow contracts
        run: python scripts/check_ci.py
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Isolate environment
        run: |
          python -m venv .venv
          python -c "import os,pathlib; p=pathlib.Path('.venv') / ('Scripts' if os.name == 'nt' else 'bin'); f=open(os.environ['GITHUB_PATH'],'a',encoding='utf-8'); f.write(str(p.resolve())+'\n'); f.close()"
      - name: Install
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Bandit
        run: python -m bandit -r src -q
      - name: Audit
        run: python -m pip_audit --disable-pip --require-hashes -r requirements-dev.lock --progress-spinner off
